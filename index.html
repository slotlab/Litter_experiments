<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Litter Bag Loader</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; background: #f5f5f5; }
    h1 { font-size: 1.4rem; }
    video { width: 100%; max-height: 45vh; background: #000; border-radius: 8px; }
    #preview { max-width: 100%; margin-top: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .row { margin: 10px 0; }
    button { padding: 12px 16px; font-size: 1rem; margin: 4px; border: none; border-radius: 6px; background: #1a73e8; color: white; }
    input { font-size: 1.2rem; padding: 8px; width: 100%; box-sizing: border-box; }
    .status { min-height: 1.5em; color: #333; white-space: pre-wrap; }
    .ok { color: green; }
    .err { color: #c00; }
    .raw { font-size: 0.85rem; color: #555; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Litter Bag Loader</h1>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>
  <img id="preview" alt="OCR preview">

  <div class="row">
    <button id="btnTag">Capture Tag</button>
    <button id="btnMass">Capture Mass</button>
  </div>

  <div class="row">
    <label>Bag ID<br>
      <input id="bag" placeholder="e.g. Q260001 or A260145" autocomplete="off">
    </label>
  </div>
  <div class="row">
    <label>Mass<br>
      <input id="mass" type="number" step="0.01" placeholder="e.g. 12.45" autocomplete="off">
    </label>
  </div>

  <div class="row">
    <button id="btnSubmit">Submit to Sheet</button>
  </div>
  <div id="status" class="status"></div>
  <div id="raw" class="raw"></div>

  <script>
    const WEB_APP = "https://script.google.com/macros/s/AKfycbzo-9C1EV4fdGmMgsFmocIjNaPJ5VS1aKllQiizxonB4fSw1Quuti2o34z75RfWhUKs/exec";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const preview = document.getElementById("preview");
    const bagInput = document.getElementById("bag");
    const massInput = document.getElementById("mass");
    const statusEl = document.getElementById("status");
    const rawEl = document.getElementById("raw");

    let worker = null;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(r => video.onloadedmetadata = r);
        statusEl.textContent = "Camera ready";
      } catch (err) {
        statusEl.textContent = "Camera error: " + err.message;
        statusEl.className = "status err";
      }
    }

    async function initOCR() {
      statusEl.textContent = "Loading OCR…";
      worker = await Tesseract.createWorker("eng", 1, {
        logger: m => { if (m.status === "recognizing text") statusEl.textContent = `OCR ${Math.round(m.progress * 100)}%`; }
      });
      statusEl.textContent = "Ready";
    }

    function makeCrop(srcCanvas, xFrac, yFrac, wFrac, hFrac, scale = 2) {
      const sx = Math.floor(srcCanvas.width * xFrac);
      const sy = Math.floor(srcCanvas.height * yFrac);
      const sw = Math.floor(srcCanvas.width * wFrac);
      const sh = Math.floor(srcCanvas.height * hFrac);
      const out = document.createElement("canvas");
      out.width = sw * scale;
      out.height = sh * scale;
      const octx = out.getContext("2d");
      octx.imageSmoothingEnabled = true;
      octx.drawImage(srcCanvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
      return out;
    }

    function preprocess(sourceCanvas, invert = false) {
      const out = document.createElement("canvas");
      out.width = sourceCanvas.width;
      out.height = sourceCanvas.height;
      const octx = out.getContext("2d");
      octx.drawImage(sourceCanvas, 0, 0);
      const imgData = octx.getImageData(0, 0, out.width, out.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        let v = (data[i] + data[i+1] + data[i+2]) / 3;
        v = (v - 128) * 1.5 + 128;
        v = Math.max(0, Math.min(255, v));
        if (invert) v = 255 - v;
        data[i] = data[i+1] = data[i+2] = v;
      }
      octx.putImageData(imgData, 0, 0);
      return out;
    }

    function scoreText(text) {
      const cleaned = (text || "").replace(/\s+/g, " ").trim();
      const match = cleaned.match(/[QAqa]\d{5,6}/i);
      return {
        cleaned,
        score: cleaned.length + (match ? 20 : 0) + (cleaned.match(/\d{5,}/) ? 5 : 0),
        match: match ? match[0].toUpperCase() : null
      };
    }

    async function captureAndOCR(mode) {
      if (!worker) return;
      if (!video.videoWidth || !video.videoHeight) {
        statusEl.textContent = "Camera not ready — wait and try again";
        return;
      }

      const isMass = mode === "mass";
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      statusEl.textContent = "Reading…";
      rawEl.textContent = "";

      const crops = [
        { x: 0.15, y: 0.3, w: 0.7, h: 0.4 },
        { x: 0.1, y: 0.25, w: 0.8, h: 0.5 },
        { x: 0.2, y: 0.35, w: 0.6, h: 0.3 }
      ];

      let best = { cleaned: "", score: -1, match: null, preview: null };

      try {
        for (const c of crops) {
          const crop = makeCrop(canvas, c.x, c.y, c.w, c.h, 2);
          for (const invert of [true, false]) {
            const processed = preprocess(crop, invert && !isMass);
            const psms = isMass ? ["7", "8"] : ["7", "6", "8", "13"];
            for (const psm of psms) {
              await worker.setParameters({
                tessedit_pageseg_mode: psm,
                tessedit_char_whitelist: isMass ? "0123456789." : ""
              });
              const { data: { text } } = await worker.recognize(processed);
              const result = scoreText(text);
              if (result.score > best.score) {
                best = { ...result, preview: processed.toDataURL("image/jpeg", 0.8) };
              }
            }
          }
        }

        if (best.preview) preview.src = best.preview;
        rawEl.textContent = "Raw OCR: " + (best.cleaned || "(nothing)");

        if (mode === "tag") {
          if (best.match) {
            bagInput.value = best.match;
          } else {
            // soft fix then retry
            const fixed = best.cleaned
              .replace(/[Oo]/g, "0").replace(/[IiLl]/g, "1")
              .replace(/[Ss]/g, "5").replace(/[Zz]/g, "2");
            const m = fixed.match(/[QAqa]\d{5,6}/i);
            bagInput.value = m ? m[0].toUpperCase() : (fixed.replace(/[^A-Za-z0-9]/g, "").toUpperCase() || "");
          }
        } else {
          const m = best.cleaned.match(/\d+\.?\d*/);
          massInput.value = m ? m[0] : best.cleaned.replace(/[^0-9.]/g, "");
        }
        statusEl.textContent = "OCR done — edit if needed";
      } catch (err) {
        statusEl.textContent = "OCR error: " + err.message;
        statusEl.className = "status err";
      }
    }

    document.getElementById("btnTag").onclick = () => captureAndOCR("tag");
    document.getElementById("btnMass").onclick = () => captureAndOCR("mass");

    document.getElementById("btnSubmit").onclick = async () => {
      const bag = bagInput.value.trim().toUpperCase();
      const mass = parseFloat(massInput.value);
      if (!bag || isNaN(mass)) {
        statusEl.textContent = "Need a valid bag ID and mass";
        statusEl.className = "status err";
        return;
      }
      statusEl.textContent = "Sending…";
      try {
        await fetch(WEB_APP, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ bag, mass })
        });
        statusEl.textContent = "Submitted. Bag: " + bag + " mass: " + mass;
        statusEl.className = "status ok";
      } catch (err) {
        statusEl.textContent = "Submit failed: " + err.message;
        statusEl.className = "status err";
      }
    };

    (async () => {
      await initCamera();
      await initOCR();
    })();
  </script>
</body>
</html>
