<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Litter Bag Loader</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; background: #f5f5f5; }
    h1 { font-size: 1.4rem; }
    video { width: 100%; max-height: 45vh; background: #000; border-radius: 8px; }
    #preview { max-width: 100%; margin-top: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .row { margin: 10px 0; }
    button { padding: 12px 16px; font-size: 1rem; margin: 4px; border: none; border-radius: 6px; background: #1a73e8; color: white; }
    input { font-size: 1.2rem; padding: 8px; width: 100%; box-sizing: border-box; }
    .status { min-height: 1.5em; color: #333; white-space: pre-wrap; }
    .ok { color: green; }
    .err { color: #c00; }
    .raw { font-size: 0.85rem; color: #555; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Litter Bag Loader</h1>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>
  <img id="preview" alt="OCR preview">

  <div class="row">
    <button id="btnTag">Capture Tag</button>
    <button id="btnMass">Capture Mass</button>
  </div>

  <div class="row">
    <label>Bag ID<br>
      <input id="bag" placeholder="e.g. Q260001 or A260145" autocomplete="off">
    </label>
  </div>
  <div class="row">
    <label>Mass<br>
      <input id="mass" type="number" step="0.01" placeholder="e.g. 12.45" autocomplete="off">
    </label>
  </div>

  <div class="row">
    <button id="btnSubmit">Submit to Sheet</button>
  </div>
  <div id="status" class="status"></div>
  <div id="raw" class="raw"></div>

  <script>
    const WEB_APP = "https://script.google.com/macros/s/AKfycbzo-9C1EV4fdGmMgsFmocIjNaPJ5VS1aKllQiizxonB4fSw1Quuti2o34z75RfWhUKs/exec";
    const OCR_API_KEY = "helloworld"; // free demo key; get your own at https://ocr.space/ocrapi for higher limits

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const preview = document.getElementById("preview");
    const bagInput = document.getElementById("bag");
    const massInput = document.getElementById("mass");
    const statusEl = document.getElementById("status");
    const rawEl = document.getElementById("raw");

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(r => video.onloadedmetadata = r);
        statusEl.textContent = "Camera ready";
      } catch (err) {
        statusEl.textContent = "Camera error: " + err.message;
        statusEl.className = "status err";
      }
    }

    async function captureAndOCR(mode) {
      if (!video.videoWidth || !video.videoHeight) {
        statusEl.textContent = "Camera not ready";
        return;
      }

      const isMass = mode === "mass";
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      const cw = Math.floor(canvas.width * 0.7);
      const ch = Math.floor(canvas.height * 0.4);
      const crop = document.createElement("canvas");
      crop.width = Math.floor(cw * 1.5);
      crop.height = Math.floor(ch * 1.5);
      crop.getContext("2d").drawImage(
        canvas,
        (canvas.width - cw) / 2,
        (canvas.height - ch) / 2,
        cw, ch,
        0, 0, crop.width, crop.height
      );

      preview.src = crop.toDataURL("image/jpeg", 0.8);

      statusEl.textContent = "Sending to OCR.space…";
      rawEl.textContent = "";

      try {
        const blob = await new Promise(r => crop.toBlob(r, "image/jpeg", 0.7));
        const form = new FormData();
        form.append("file", blob, "crop.jpg");
        form.append("language", "eng");
        form.append("OCREngine", "2");
        form.append("scale", "true");
        form.append("isOverlayRequired", "false");

        const res = await fetch("https://api.ocr.space/parse/image", {
          method: "POST",
          headers: { "apikey": OCR_API_KEY },
          body: form
        });
        const json = await res.json();

        if (json.IsErroredOnProcessing) {
          throw new Error(json.ErrorMessage || "OCR failed");
        }
        const cleaned = (json.ParsedResults?.[0]?.ParsedText || "").replace(/\s+/g, " ").trim();
        rawEl.textContent = "Raw OCR: " + (cleaned || "(nothing)");

        if (mode === "tag") {
          const match = cleaned.match(/[QAqa]\d{5,6}/i);
          bagInput.value = match ? match[0].toUpperCase() : cleaned.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
        } else {
          const match = cleaned.match(/\d+\.?\d*/);
          massInput.value = match ? match[0] : cleaned.replace(/[^0-9.]/g, "");
        }
        statusEl.textContent = "OCR done — edit if needed";
      } catch (err) {
        statusEl.textContent = "OCR error: " + err.message;
        statusEl.className = "status err";
      }
    }

    document.getElementById("btnTag").onclick = () => captureAndOCR("tag");
    document.getElementById("btnMass").onclick = () => captureAndOCR("mass");

    document.getElementById("btnSubmit").onclick = async () => {
      const bag = bagInput.value.trim().toUpperCase();
      const mass = parseFloat(massInput.value);
      if (!bag || isNaN(mass)) {
        statusEl.textContent = "Need a valid bag ID and mass";
        statusEl.className = "status err";
        return;
      }
      statusEl.textContent = "Sending…";
      try {
        await fetch(WEB_APP, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ bag, mass })
        });
        statusEl.textContent = "Submitted. Bag: " + bag + " mass: " + mass;
        statusEl.className = "status ok";
      } catch (err) {
        statusEl.textContent = "Submit failed: " + err.message;
        statusEl.className = "status err";
      }
    };

    initCamera();
  </script>
</body>
</html>
