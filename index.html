<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Litter Bag Loader</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; background: #f5f5f5; }
    h1 { font-size: 1.4rem; }
    video { width: 100%; max-height: 50vh; background: #000; border-radius: 8px; }
    .row { margin: 10px 0; }
    button { padding: 12px 16px; font-size: 1rem; margin: 4px; border: none; border-radius: 6px; background: #1a73e8; color: white; }
    button:disabled { opacity: 0.5; }
    input { font-size: 1.2rem; padding: 8px; width: 100%; box-sizing: border-box; }
    .status { min-height: 1.5em; color: #333; }
    .ok { color: green; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>Litter Bag Loader</h1>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>

  <div class="row">
    <button id="btnTag">Capture Tag</button>
    <button id="btnMass">Capture Mass</button>
  </div>

  <div class="row">
    <label>Bag ID<br>
      <input id="bag" placeholder="e.g. Q260001 or A260145" autocomplete="off">
    </label>
  </div>
  <div class="row">
    <label>Mass<br>
      <input id="mass" type="number" step="0.01" placeholder="e.g. 12.45" autocomplete="off">
    </label>
  </div>

  <div class="row">
    <button id="btnSubmit">Submit to Sheet</button>
  </div>
  <div id="status" class="status"></div>

  <script>
    // Paste your deployed Apps Script /exec URL here
    const WEB_APP = "https://script.google.com/macros/s/AKfycbzo-9C1EV4fdGmMgsFmocIjNaPJ5VS1aKllQiizxonB4fSw1Quuti2o34z75RfWhUKs/exec";
    
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const bagInput = document.getElementById("bag");
    const massInput = document.getElementById("mass");
    const statusEl = document.getElementById("status");

    let worker = null;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        statusEl.textContent = "Camera error: " + err.message;
        statusEl.className = "status err";
      }
    }

    async function initOCR() {
      statusEl.textContent = "Loading OCR engine…";
      worker = await Tesseract.createWorker("eng", 1, {
        logger: m => { if (m.status === "recognizing text") statusEl.textContent = `OCR ${Math.round(m.progress * 100)}%`; }
      });
      // Helpful for digits / short codes
      await worker.setParameters({
        tessedit_char_whitelist: "0123456789.QAq a",
        tessedit_pageseg_mode: "7" // single line / treat as single text line
      });
      statusEl.textContent = "Ready";
    }

    async function captureAndOCR(mode) {
      if (!worker) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      statusEl.textContent = "Reading…";
      const { data: { text } } = await worker.recognize(canvas);
      const cleaned = text.replace(/\s+/g, " ").trim();

      if (mode === "tag") {
        // Prefer patterns like Q260001 / A260145
        const match = cleaned.match(/[QAqa]\d{5,6}/);
        bagInput.value = match ? match[0].toUpperCase() : cleaned.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      } else {
        // Prefer a number with optional decimal
        const match = cleaned.match(/\d+\.?\d*/);
        massInput.value = match ? match[0] : cleaned.replace(/[^0-9.]/g, "");
      }
      statusEl.textContent = "OCR done — edit if needed";
    }

    document.getElementById("btnTag").onclick = () => captureAndOCR("tag");
    document.getElementById("btnMass").onclick = () => captureAndOCR("mass");

    document.getElementById("btnSubmit").onclick = async () => {
      const bag = bagInput.value.trim().toUpperCase();
      const mass = parseFloat(massInput.value);
      if (!bag || isNaN(mass)) {
        statusEl.textContent = "Need a valid bag ID and mass";
        statusEl.className = "status err";
        return;
      }
      statusEl.textContent = "Sending…";
      try {
        const res = await fetch(WEB_APP, {
          method: "POST",
          mode: "no-cors", // Apps Script often needs this for simple posts; response may be opaque
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ bag, mass })
        });
        // With no-cors you won’t see the body; treat as sent if no network error
        statusEl.textContent = "Submitted (check sheet). Bag: " + bag + " mass: " + mass;
        statusEl.className = "status ok";
        // Optional: clear fields
        // bagInput.value = ""; massInput.value = "";
      } catch (err) {
        statusEl.textContent = "Submit failed: " + err.message;
        statusEl.className = "status err";
      }
    };

    (async () => {
      await initCamera();
      await initOCR();
    })();
  </script>
</body>
</html>
